server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://192.168.100.128:3307/innovation_project?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    mongodb:
      uri: mongodb://192.168.100.128:27017/innovation_project
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: http://192.168.100.128:9000
  access-key: minioadmin
  secret-key: minioadmin
  default-bucket: project-attachments

jwt:
  secret: InnovationProjectSecretKey2024VeryLongSecretForSecurity
  expiration: 86400000

file:
  upload-path: ./uploads

knife4j:
  enable: true
  setting:
    language: zh_cn
