server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://192.168.100.128:3307/innovation_project?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: InnovationHikariCP
  data:
    mongodb:
      uri: mongodb://192.168.100.128:27017/innovation_project
  rabbitmq:
    host: 192.168.100.128
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

minio:
  endpoint: http://192.168.100.128:9000
  access-key: minioadmin
  secret-key: minioadmin
  default-bucket: project-attachments

jwt:
  secret: InnovationProjectSecretKey2024VeryLongSecretForSecurity
  expiration: 86400000

file:
  upload-path: ./uploads

knife4j:
  enable: true
  setting:
    language: zh_cn
